# @dsh-tvision/dsh-tvision — a character-cell window manager for DeepSeek
# Harness agents, as a bundle patch layer over @deepseek-ai/dsh-base.
#
# A patch replaces the targeted row's whole `config`, so each overridden row below
# restates every key it owns. Later layers (the profile's own cordis.patch.yml,
# $DSH_HOME/cordis.patch.yml, and any --patch overlay) re-patch these rows, which
# is where a deployment repoints the model route or the DeepSeek endpoint.

# ── base rows this surface overrides ────────────────────────────────────────

# `main` is the agent the desktop drives. Its session identity (a fresh UUID or
# the `--resume` id) is fixed by the tvision-startup row through the
# configuredAgentIdentities slot; `inject` makes this row wait for it.
- id: agent-loop
  inject: [tvisionStartup]
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-flash
        cwd: !!js process.cwd()

# Keep the persona to identity and behaviour; the tool plugins own tool
# guidance. The key is `personaPrefix` (dsh ≥ 0.2 renamed it from `persona`,
# and the old key composed but was silently dropped by the config schema —
# the custom persona never reached the prompt). The loop resolves {{model}}
# from this agent's configuration; unknown template variables fail the turn,
# so this reference is verified by the wire rung.
- id: system-prompt
  config:
    personaPrefix: |
      You are a coding agent powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

# Full thinking at max effort on every request. The key and endpoint stay
# unconfigured here: both resolve per request from the `llm-deepseek:` settings
# section, the credential store, and $DEEPSEEK_BASE_URL.
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max

# ── tvision-only rows ───────────────────────────────────────────────────────
#
# Only rows `@deepseek-ai/dsh-base` does not already provide appear here. That is
# not a style preference: the loader rejects a duplicate id outright, so
# re-inserting a base-owned row (`storage`, for instance) makes the whole
# profile fail to boot. Re-verify against `dsh --profile tvision --dump-config`
# before adding one; that is how `session-reference` proved absent from base
# despite an earlier note here claiming otherwise — and how `tool-ask-user`,
# base-owned through 0.2.1, became an insert in 0.2.2.

- insert:
    # The model-facing half of the user-questions seam. The desktop has always
    # answered `user-questions/request` and rendered the dialogs, but dsh-base
    # stopped mounting this row: 0.2.2-rc.5's patch has no `tool-ask-user`, so
    # the UI had no producer and plan mode's own prompt told the model to call
    # a tool that was not in its catalog. Verified absent from base with
    # `--dump-config`; the loader will reject the duplicate if that changes.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # MCP is the one cross-product tool protocol here; the rest of the Web
    # presets' extras are DSH tools with Web-shaped management pages. The
    # shipped list is empty on purpose: a deployment adds servers in its own
    # profile patch and their tools appear as `mcp__<server>__<tool>`. The row
    # injects the credentials provider so `${credential:REF}` works in
    # command/env/url/headers. No server runs until one is configured.
    - id: mcp-manager
      name: '@deepseek-ai/dsh-mcp-manager'
      inject: [credentials]
      config:
        servers: {}

    # Cross-session references: @-completion offers other sessions, and a
    # canonical mention makes the service attach a bounded read-only snapshot
    # of that session to the message. Not a dsh-base row (verified against
    # `--dump-config`); if base ever mounts it under this id, the loader
    # rejects the duplicate loudly and this row goes.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    # Command-line intake and session identity for the rows above.
    - id: tvision-startup
      name: '@dsh-tvision/dsh-tvision/startup'

    # Named display fragments the prompt and status line interpolate.
    - id: tvision-prompt
      name: '@dsh-tvision/dsh-tvision/prompt'

    # The desktop itself. It renders exactly the agent the agent-loop row bound,
    # so it reads the startup-owned identity rather than restating one.
    #
    # Every name a `!!js` expression reads from `ctx` must be listed in `inject`:
    # the loader evaluates the expression with only the injected services
    # resolved, and reading anything else throws
    # "cannot get property ... without inject" at boot.
    - id: tvision
      name: '@dsh-tvision/dsh-tvision'
      inject: [tvisionStartup, tvisionGoodbyeMessage]
      config:
        sessionId: !!js ctx.tvisionStartup.sessionId
        skin: !!js ctx.tvisionStartup.skin
        mouse: !!js ctx.tvisionStartup.mouse
        goodbye: !!js ctx.tvisionGoodbyeMessage
